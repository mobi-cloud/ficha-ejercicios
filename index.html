<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha de ejercicios</title>
<meta name="theme-color" content="#1f44d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ejercicios">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none !important}
:root{
  /* Minimalista: bloque azul cobalto arriba, amarillo pelota para lo avanzado, tarjetas planas con borde fino, mucho aire. */
  --bg:#eef1f6;
  --surface:#ffffff;
  --ink:#0c1220;
  --muted:#5a6377;
  --line:#dbe0ea;
  --field:#f3f5f9;
  --primary:#1f44d6;
  --primary-ink:#ffffff;
  --adv:#d8ee3c;
  --adv-ink:#1c2300;
  --danger:#c6352a;
  --display:"Archivo", "Arial Narrow", Arial, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f1a; --surface:#151b2b; --ink:#eef1f8; --muted:#9aa3b8; --line:#273049; --field:#1c2336;
    --primary:#3d63f0; --primary-ink:#ffffff; --adv:#d8ee3c; --adv-ink:#1c2300; --danger:#ff7a6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f1a; --surface:#151b2b; --ink:#eef1f8; --muted:#9aa3b8; --line:#273049; --field:#1c2336;
  --primary:#3d63f0; --primary-ink:#ffffff; --adv:#d8ee3c; --adv-ink:#1c2300; --danger:#ff7a6e;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--adv);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.disp{font-family:var(--display);font-stretch:118%;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:.95}

/* Cabeçalho = quadra */
header.top{position:relative;overflow:hidden;background:var(--primary);color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 22px 28px;display:flex;flex-direction:column;gap:8px;border-radius:0 0 28px 28px}
header.top > *{position:relative;z-index:1;max-width:680px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;padding:8px 14px 8px 10px;font-weight:700;font-size:14.5px}
.eyebrow{font-family:var(--display);font-stretch:100%;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--adv)}
header.top h1{font-size:clamp(36px,11vw,56px);overflow-wrap:anywhere}
header.top p{margin:0;color:rgba(255,255,255,.82);font-size:15px;max-width:44ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.ghost{border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:12px;padding:7px 14px;font-weight:700;font-size:14px}

main{max-width:720px;margin:0 auto;padding:20px 16px calc(env(safe-area-inset-bottom) + 120px);display:flex;flex-direction:column;gap:12px}
main.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
main.grid .status{grid-column:1/-1}
.status{background:var(--surface);border:2px dashed var(--line);border-radius:22px;padding:34px 22px;text-align:center;color:var(--muted)}
.status h2{color:var(--ink);font-size:20px;margin-bottom:6px;font-family:var(--display);font-stretch:110%;font-weight:800;text-transform:uppercase}
.status p{margin:0}

/* Alunos: cartões em grade */
.student{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;background:var(--surface);border-radius:24px;padding:16px 16px 18px;text-align:left;width:100%;min-height:150px;border:1px solid var(--line);overflow:hidden}
.avatar{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb, var(--primary) 12%, var(--surface));color:var(--primary);display:grid;place-items:center;flex:none;font-family:var(--display);font-stretch:120%;font-weight:900;font-size:19px}
.student .info{display:flex;flex-direction:column;gap:4px;min-width:0;width:100%}
.student .name{font-family:var(--display);font-stretch:108%;font-weight:800;font-size:19px;text-transform:uppercase;line-height:1;overflow-wrap:anywhere}
.student .count{color:var(--muted);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.student .chev{display:none}
.chev{color:var(--muted);flex:none}

/* Ficha: sequência numerada */
.row{display:flex;gap:8px;align-items:stretch}
.row > .ex{flex:1}
.ex{position:relative;display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:14px;background:var(--surface);border-radius:22px;padding:10px 12px 10px 10px;text-align:left;width:100%;border:1px solid var(--line);margin-left:14px;width:calc(100% - 14px)}
.num{color:#0c1220 !important;position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--adv);color:var(--adv-ink);display:grid;place-items:center;font-family:var(--display);font-stretch:120%;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;border:3px solid var(--bg);z-index:1}
.thumb{width:72px;height:72px;border-radius:16px;background:var(--field);overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.ex .info{min-width:0;display:flex;flex-direction:column;gap:7px}
.ex .name{font-weight:700;font-size:16.5px;line-height:1.25;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:color-mix(in srgb, var(--primary) 12%, var(--surface));color:var(--primary);font-variant-numeric:tabular-nums}
.chip.adv{background:var(--adv);color:var(--adv-ink)}
.reorder{display:flex;flex-direction:column;gap:6px;flex:none}
.reorder button{flex:1;width:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--primary)}
.reorder button:disabled{opacity:.3;cursor:default}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 24px 12px 12px;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em;box-shadow:0 8px 20px rgba(12,18,32,.18);z-index:5;white-space:nowrap;display:flex;align-items:center;gap:12px}
.fab .plus{width:34px;height:34px;border-radius:50%;background:var(--adv);color:var(--adv-ink);display:grid;place-items:center;font-size:22px;line-height:1}

/* Folhas */
.overlay{position:fixed;inset:0;background:rgba(8,12,22,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:94%;border-radius:30px 30px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:760px){.overlay{align-items:center}.sheet{border-radius:30px;max-height:90%}}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 20px 12px}
.sheet-head h2{font-size:26px;overflow-wrap:anywhere}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--field);display:grid;place-items:center;flex:none}
.sheet-body{overflow-y:auto;padding:4px 20px 22px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line)}
.btn{border-radius:999px;padding:13px 22px;font-weight:700;font-size:16px;border:1.5px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--danger)}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.spacer{flex:1}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:999px;padding:5px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:11px;font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.seg button.adv[aria-pressed="true"]{background:var(--adv);color:var(--adv-ink)}
.media{border-radius:22px;overflow:hidden;background:var(--field)}
.media img,.media video{width:100%;max-height:60vh;object-fit:contain;display:block;background:#000}
.yt{display:flex;align-items:center;gap:12px;padding:16px;text-decoration:none;color:var(--ink);font-weight:700}
.yt .play{width:46px;height:46px;border-radius:50%;background:#e62117;display:grid;place-items:center;flex:none}
.yt small{display:block;font-weight:500;color:var(--muted);overflow-wrap:anywhere}
.dose{display:flex;flex-direction:column;gap:6px;background:var(--primary);color:var(--primary-ink);border-radius:22px;padding:16px 18px}
.dose.adv{background:var(--adv);color:var(--adv-ink)}
.dose .label{color:inherit;opacity:.8}
.label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dose .val{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.instr{white-space:pre-wrap;max-width:65ch;margin:0}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -20px;padding:0 20px;gap:20px;scroll-padding:0 20px}
.slides::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;gap:16px}
.swipe-hint{text-align:center}
.add-adv{display:flex;align-items:center;gap:10px;justify-content:center;border:1.5px dashed var(--line);background:transparent;border-radius:22px;padding:16px;font-weight:700;color:var(--muted)}
.add-adv .tag{background:var(--adv)}
.rm-adv{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-family:var(--body);font-weight:700;font-size:13px;text-transform:none;letter-spacing:0;color:var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:600;color:var(--muted);padding:0 4px 2px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.pos-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pos-pick button{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;font-weight:700;font-size:14.5px;text-align:left}
.pos-pick button i{width:22px;height:22px;border-radius:50%;flex:none}
.pos-pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tpl{display:flex;flex-direction:column;gap:8px}
.tpl-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--primary);background:color-mix(in srgb, var(--primary) 8%, var(--surface));color:var(--primary);border-radius:16px;padding:13px 16px;font-weight:700;font-size:15px;text-align:left}
.tpl-toggle::after{content:"▾";margin-left:6px}
.tpl-toggle[aria-expanded="true"]::after{content:"▴"}
.tpl-toggle span:first-child{flex:1}
.tpl-n{background:var(--primary);color:var(--primary-ink);border-radius:999px;padding:1px 9px;font-size:13px}
.tpl-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:16px;padding:6px}
.tpl-list button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:12px;padding:10px;text-align:left;font-weight:600}
.tpl-list button:hover,.tpl-list button:focus-visible{background:var(--field)}
.tpl-list i{width:14px;height:14px;border-radius:50%;flex:none}
.tpl-name{overflow-wrap:anywhere}
.empty-level{color:var(--muted);font-style:italic;margin:0}
.variant-name{font-weight:700;font-size:17px}

.field{display:flex;flex-direction:column;gap:8px}
.field > label,.field > .flabel{font-weight:700;font-size:15.5px}
.field input[type=text],.field input[type=url],.field textarea{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;font-size:16px}
.field textarea{min-height:110px;resize:vertical}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.level{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}


.level h3{display:flex;align-items:center;gap:10px;font-family:var(--display);font-stretch:108%;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.tag{width:14px;height:14px;border-radius:50%;background:var(--primary)}
.level.adv-box .tag{background:var(--adv)}
.mtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 8px;font-weight:700;font-size:14px}
.mtabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.preview{position:relative;border-radius:16px;overflow:hidden;background:var(--surface)}
.preview img,.preview video{width:100%;max-height:260px;object-fit:contain;display:block;background:#000}
.preview .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.pick{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed color-mix(in srgb, var(--primary) 50%, var(--line));border-radius:16px;padding:16px;font-weight:700;background:var(--surface);color:var(--primary);cursor:pointer}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.err{color:var(--danger);font-size:14px;font-weight:600;margin:0}
.picklist{display:flex;flex-direction:column;gap:8px}
.picklist button{display:flex;align-items:center;gap:12px;border:0;background:var(--field);border-radius:999px;padding:8px 16px 8px 8px;text-align:left;font-weight:700}
.picklist .avatar{width:40px;height:40px;font-size:16px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14.5px;z-index:40;display:none;max-width:90%;text-align:center}
.toast.show{display:block}
.small .sheet{max-width:440px}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
/* --- añadidos sitio --- */
a.ghost{text-decoration:none;display:inline-flex;align-items:center}
.ghost.strong{background:var(--adv);color:var(--adv-ink);border-color:var(--adv)}
.login-box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:420px;width:100%;margin:0 auto}
.login-box input{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px}
.login-box .btn{width:100%}
.offline{margin:0;font-size:14px;font-weight:600;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 14px}
/* vista del alumno */
main.pupil{gap:10px}
.pex{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pex summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.pex summary::-webkit-details-marker{display:none}
.pex .n{width:30px;height:30px;border-radius:50%;background:var(--adv);color:#0c1220;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex:none;font-family:var(--display)}
.pex .nm{flex:1;font-weight:700;overflow-wrap:anywhere}
.pbody{padding:0 14px 16px;display:flex;flex-direction:column;gap:14px}
.lvl{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.lvl-t{align-self:flex-start;background:var(--primary);color:var(--primary-ink);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 12px}
.lvl.adv .lvl-t{background:var(--adv);color:var(--adv-ink)}
.lvl .var{margin:0;font-weight:700}
.lvl .media img,.lvl .media video{max-height:70vh}
.pdose{display:flex;flex-direction:column;gap:2px}
.pdose span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pdose b{font-size:24px;font-family:var(--display);font-stretch:110%;font-weight:800}
.pslides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pslides::-webkit-scrollbar{display:none}
.pslides .lvl{flex:0 0 90%;scroll-snap-align:start}
html,body{max-width:100%;overflow-x:hidden}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="list"><div class="status"><h2>Cargando…</h2></div></main>
<button class="fab" id="fab" hidden><span class="plus">+</span><span id="fabText"></span></button>

<div class="overlay" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="dTitle" class="disp"></h2>
      <button class="icon-btn" id="dClose" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="dBody"></div>
    <div class="sheet-foot">
      <button class="btn danger" id="dDelete">Eliminar</button>
      <span class="spacer"></span>
      <button class="btn" id="dCopy">Copiar a…</button>
      <button class="btn primary" id="dEdit">Editar</button>
    </div>
  </div>
</div>

<div class="overlay" id="form" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="fTitle" class="disp">Nuevo ejercicio</h2></div>
    <div class="sheet-body">
      <div class="tpl" id="fTpl" hidden></div>
      <div class="field">
        <label for="fName">Nombre del ejercicio</label>
        <input id="fName" type="text" placeholder="Ej.: Sentadilla búlgara" autocomplete="off">
      </div>
      <div class="field">
        <span class="flabel">Posición</span>
        <div class="pos-pick" id="fPos" role="group" aria-label="Posición"></div>
      </div>
      <div id="levels" style="display:flex;flex-direction:column;gap:16px"></div>
      <p class="err" id="fErr" hidden></p>
    </div>
    <div class="sheet-foot">
      <button class="btn" id="fCancel">Cancelar</button>
      <button class="btn primary" id="fSave">Guardar</button>
    </div>
  </div>
</div>

<div class="overlay small" id="sForm" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="sTitle" class="disp">Nuevo alumno</h2></div>
    <div class="sheet-body">
      <div class="field">
        <label for="sName">Nombre del alumno</label>
        <input id="sName" type="text" placeholder="Ej.: Silvia" autocomplete="off">
      </div>
      <p class="err" id="sErr" hidden></p>
    </div>
    <div class="sheet-foot">
      <button class="btn danger" id="sDelete" hidden>Eliminar alumno</button>
      <span class="spacer"></span>
      <button class="btn" id="sCancel">Cancelar</button>
      <button class="btn primary" id="sSave">Guardar</button>
    </div>
  </div>
</div>

<div class="overlay small" id="copy" role="dialog" aria-modal="true" aria-labelledby="cpTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="cpTitle" class="disp">Copiar a</h2>
      <button class="icon-btn" id="cpClose" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body"><div class="picklist" id="cpList"></div></div>
  </div>
</div>
